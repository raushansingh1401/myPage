      <li>Enhanced and upgraded Contacts and Phone applications for OS updates, aligning with updated Android guidelines.</li>
      <li>Developed an Android application for proximity sensing using Fourier transform patterns of ultrasound signals</li>
      <li>Built additional applications, including an account management system and RSSI-based signal sensing.</li>
